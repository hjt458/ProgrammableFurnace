# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.76

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale.
mod_id=programmablefurnace
# The human-readable display name for the mod.
mod_name=Programmable Furnace
# The license of the mod.
mod_license=All Rights Reserved
# The mod version.
mod_version=1.0.0.0
# The group ID for the mod. Matches the base package used for the mod sources.
mod_group_id=dev.programmablefurnace

